title: AD Enumeration Tooling Execution (BloodHound / SharpHound / AdFind)
id: 7a1c2e10-0a1a-4e1a-9b1a-aa1111110012
status: experimental
description: Detects execution of common Active Directory reconnaissance tools that enumerate users, groups and trusts over LDAP (BloodHound/SharpHound, AdFind).
author: Ruslan Mammadov - BlueTeam Account 2 (SOC)
date: 2026/10/17
references:
    - https://attack.mitre.org/techniques/T1087/002/
    - https://attack.mitre.org/techniques/T1482/
logsource:
    product: windows
    category: process_creation
    service: sysmon
detection:
    selection_bloodhound:
        - Image|endswith:
              - '\SharpHound.exe'
              - '\bloodhound.exe'
        - CommandLine|contains:
              - 'Invoke-BloodHound'
              - 'SharpHound'
              - '-CollectionMethod'
    selection_adfind:
        Image|endswith: '\AdFind.exe'
        CommandLine|contains:
            - 'objectcategory='
            - '-gcb'
            - '-sc trustdmp'
    condition: 1 of selection_*
falsepositives:
    - Authorized internal red-team or AD health-check activity
level: high
tags:
    - attack.discovery
    - attack.t1087.002
    - attack.t1482
