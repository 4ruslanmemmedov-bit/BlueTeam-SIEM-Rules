title: Possible Cobalt Strike Default Named Pipe
id: 7a1c2e10-0a1a-4e1a-9b1a-aa1111110009
status: experimental
description: Detects creation or connection of named pipes used by default Cobalt Strike profiles (SMB beacon, post-exploitation jobs). A custom Malleable C2 profile may rename the pipes, so this covers default/unchanged settings (relevant to Account 3's Cobalt Strike test, bend 20).
author: Ruslan Mammadov - BlueTeam Account 2 (SOC)
date: 2026/10/17
references:
    - https://attack.mitre.org/techniques/T1055/
    - https://attack.mitre.org/techniques/T1570/
logsource:
    product: windows
    category: pipe_created
    service: sysmon
detection:
    selection:
        PipeName|contains:
            - '\MSSE-'
            - '\msagent_'
            - '\postex_'
            - '\mypipe-'
    condition: selection
falsepositives:
    - Rare legitimate software using similar pipe names (verify the process that created the pipe)
level: high
tags:
    - attack.command-and-control
    - attack.defense-evasion
    - attack.t1055
