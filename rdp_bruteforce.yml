title: RDP Brute Force Followed by Successful Logon
id: 7a1c2e10-0a1a-4e1a-9b1a-aa1111110006
status: experimental
description: Detects a burst of failed RDP logons (4625) from a single source followed by a successful logon (4624) within a short window.
author: Ruslan Mammadov - BlueTeam Account 2 (SOC)
date: 2026/10/16
references:
    - https://attack.mitre.org/techniques/T1110/001/
logsource:
    product: windows
    service: security
detection:
    failed:
        EventID: 4625
        LogonType: 10
    success:
        EventID: 4624
        LogonType: 10
    timeframe: 10m
    condition: failed | count(failed) by IpAddress > 8 and success
falsepositives:
    - Shared jump-host / PAM gateway with aggregated source IP (correlate with Teleport/Guacamole PAM session logs)
level: high
tags:
    - attack.credential_access
    - attack.t1110.001
